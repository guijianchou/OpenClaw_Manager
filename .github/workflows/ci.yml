name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Windows x64
    runs-on: windows-2025-vs2026
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.300

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Restore locked packages
        shell: pwsh
        run: dotnet restore OpenClaw.sln --locked-mode

      - name: Run Core executable harness
        shell: pwsh
        run: dotnet run --no-restore --project tests\OpenClaw.Core.Tests\OpenClaw.Core.Tests.csproj

      - name: Run VSTest workflow
        shell: pwsh
        run: dotnet test OpenClaw.sln -c Debug -p:Platform=x64 --no-restore

      - name: Build WinUI x64
        shell: pwsh
        run: dotnet build OpenClaw.sln -c Debug -p:Platform=x64 --no-restore

      - name: Verify formatting
        shell: pwsh
        run: |
          $env:Platform = 'x64'
          dotnet format OpenClaw.sln --verify-no-changes --no-restore

      - name: Verify repository guardrails
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\verify-repo-structure.ps1

      - name: Verify embedded bridge scripts
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\verify-bridge-scripts.ps1

      - name: Verify whitespace
        shell: pwsh
        run: git diff --check
